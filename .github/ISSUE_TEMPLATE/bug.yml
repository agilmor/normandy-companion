name: Bug / Fallo
description: Something does not work as it should / Algo no funciona como debería
labels: [bug]
body:
  - type: textarea
    attributes:
      label: What happened, and what did you expect? / ¿Qué ha pasado y qué esperabas?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Game code / Código de la partida
      description: In the game, ☰ → Code copies it (UNN1.…) / En la partida, ☰ → Código lo copia (UNN1.…)
      render: text
  - type: input
    attributes:
      label: Version, browser or phone / Versión, navegador o móvil
      placeholder: 0.3.0-beta, Chrome on Android
